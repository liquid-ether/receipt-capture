name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # OCR runs on the server, so the build machine needs the same engine and
      # language data the deployed app uses.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra

      - name: Restore
        run: dotnet restore ReceiptCapture.slnx

      - name: Build
        run: dotnet build ReceiptCapture.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ReceiptCapture.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"

      - name: Check localization references
        run: python3 tools/check-resources.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore

  material:
    name: Material assets are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Material components, colour scheme, fonts and icon sprite in wwwroot are
      # generated and committed so the app runs without Node. Rebuild them from
      # tools/material and fail if the committed copy has drifted from its source.
      - name: Rebuild
        working-directory: tools/material
        run: |
          npm ci
          npm run build

      - name: Compare with the committed copy
        run: git diff --exit-code -- src/ReceiptCapture.Web/wwwroot

  browser:
    name: Camera flow in a browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build the app
        run: dotnet build src/ReceiptCapture.Web --configuration Release

      # Two instances: an open one for the camera flow, and one protected by an
      # access code for the gate test.
      - name: Start the app
        env:
          ReceiptCapture__Accounting__Endpoint: https://books.example.test/api/receipts
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5199 \
          ReceiptCapture__DataDirectory=${{ runner.temp }}/receipt-data-open \
            dotnet run --project src/ReceiptCapture.Web --configuration Release --no-build --no-launch-profile &

          ASPNETCORE_URLS=http://127.0.0.1:5202 \
          ReceiptCapture__DataDirectory=${{ runner.temp }}/receipt-data-gated \
          ReceiptCapture__AccessCode=ci-access-code \
            dotnet run --project src/ReceiptCapture.Web --configuration Release --no-build --no-launch-profile &

          for port in 5199 5202; do
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:$port/api/health && break
              sleep 2
            done
          done

      - name: Run the camera flow
        working-directory: tests/browser
        run: node camera-flow.mjs http://127.0.0.1:5199

      - name: Run the access-code screen
        working-directory: tests/browser
        run: node access-gate.mjs http://127.0.0.1:5202 ci-access-code
